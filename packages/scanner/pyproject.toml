[project]
name = "scalpr-scanner"
version = "0.1.0"
description = "Cross-exchange perp arbitrage scanner"
readme = "README.md"
authors = [
    { name = "Матвей", email = "tochnonebolotnyaytka@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "scalpr-core",
]

[project.scripts]
scanner = "scalpr_scanner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
scalpr-core = { workspace = true }
